<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>陪玩</title>
    <style>
      :root {
        --ink: #f4f6ff;
        --accent: #e08a3c;
        --panel: rgba(22, 16, 12, 0.88);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        grid-template-rows: minmax(0, 1fr) auto;
        padding: 8px;
        background: transparent;
      }
      .bubble {
        grid-column: 1;
        grid-row: 1;
        align-self: end;
        margin: 0 8px 6px 0;
        padding: 10px 12px;
        max-height: 140px;
        overflow: hidden;
        background: var(--panel);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        opacity: 0;
        transform: translateY(6px);
        pointer-events: none;
      }
      .bubble.visible { opacity: 1; transform: translateY(0); }
      .bubble .who {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #ffc48a;
      }
      .pet {
        grid-column: 2;
        grid-row: 1;
        align-self: end;
        justify-self: end;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        -webkit-app-region: drag;
        cursor: grab;
      }
      .pet img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      .composer {
        grid-column: 1 / -1;
        grid-row: 2;
        display: flex;
        gap: 6px;
        margin-top: 8px;
        -webkit-app-region: no-drag;
      }
      body[data-mode="game"] .composer { display: none; }
      .composer input {
        flex: 1;
        min-width: 0;
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(22, 16, 12, 0.88);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        outline: none;
        user-select: text;
        -webkit-app-region: no-drag;
      }
      .composer button {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--accent);
        color: #2b1608;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body data-mode="desktop">
    <div id="stage">
      <div class="bubble" id="bubble">
        <span class="who">陪玩</span>
        <span id="bubble-text"></span>
      </div>
      <div class="pet hit" id="pet" title="拖动">
        <img src="pet.svg" alt="" draggable="false" />
      </div>
      <form class="composer hit" id="composer">
        <input id="chat" type="text" maxlength="200" placeholder="说点什么…" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
    </div>
    <script>
      (function () {
        var bubble = document.getElementById('bubble');
        var bubbleText = document.getElementById('bubble-text');
        var composer = document.getElementById('composer');
        var chat = document.getElementById('chat');
        var hideTimer = null;
        var lastSeq = -1;
        var lastIgnore = null;

        function post(channel, payload) {
          if (window.dshOverlay && typeof window.dshOverlay.send === 'function') {
            window.dshOverlay.send(channel, payload);
            return;
          }
          var queue = window.__DSH_OVERLAY_OUTBOX__ || [];
          queue.push({ channel: channel, payload: payload });
          window.__DSH_OVERLAY_OUTBOX__ = queue;
        }

        function setIgnore(ignore) {
          if (lastIgnore === ignore) return;
          lastIgnore = ignore;
          post('dsh-laodi:hit-test', { ignore: ignore });
        }

        function setBubble(payload) {
          var text = (payload && payload.text) || '';
          if (!text) return;
          var visible = bubble.classList.contains('visible');
          if (bubbleText.textContent === text && visible) return;
          bubbleText.textContent = text;
          bubble.classList.add('visible');
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(function () {
            bubble.classList.remove('visible');
          }, 12000);
        }

        function applyMode(mode) {
          var next = mode === 'game' ? 'game' : 'desktop';
          if (document.body.getAttribute('data-mode') === next) return;
          document.body.setAttribute('data-mode', next);
          if (next === 'game') chat.blur();
        }

        composer.addEventListener('submit', function (event) {
          event.preventDefault();
          var text = String(chat.value || '').trim();
          if (!text) return;
          chat.value = '';
          post('dsh-laodi:chat', { text: text });
        });

        window.addEventListener('mousemove', function (event) {
          var el = document.elementFromPoint(event.clientX, event.clientY);
          var hit = !!(el && el.closest && el.closest('.hit'));
          setIgnore(!hit);
        });
        document.documentElement.addEventListener('mouseleave', function () {
          setIgnore(true);
        });

        window.__DSH_OVERLAY__ = {
          setBubble: setBubble,
          applyMode: applyMode,
        };

        if (window.dshOverlay && typeof window.dshOverlay.on === 'function') {
          window.dshOverlay.on('dsh:bubble', setBubble);
        }

        setInterval(function () {
          var state = window.__DSH_OVERLAY_STATE__;
          if (!state) return;
          applyMode(state.mode);
          if (state.seq !== lastSeq) {
            lastSeq = state.seq;
            if (state.bubble) setBubble({ text: state.bubble });
          }
        }, 300);
      })();
    </script>
  </body>
</html>
